openapi: 3.1.0
info:
  title: Task 30 private LLM gateway
  version: "1.0"
  description: |
    The OpenAI-compatible HTTP API served by task30/gateway (FastAPI, gateway/app.py) in front
    of qwen3:4b-instruct in Ollama. Default address http://0.0.0.0:8030 (HOST, PORT).
    Checks on /v1/chat/completions run in this order: body size (413 body_too_large),
    API key (401), rate limit (429), request validation (400), model name (400),
    context budget (413 context_length_exceeded), a free generation slot (503 server_busy).
    All errors use the OpenAI error shape: {"error": {"message", "type", "code"}}.
servers:
  - url: http://localhost:8030
paths:
  /health:
    get:
      summary: Service status, no key required
      description: |
        "ok" when Ollama answers and the model is pulled, else "degraded"; 503 when Ollama is
        unreachable. Reports current load, the configured limits, responses served by status
        code, tokens processed and uptime.
      responses:
        "200":
          description: Ollama reachable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
        "503":
          description: Ollama unreachable
  /v1/models:
    get:
      summary: The one model this service serves
      security: [{bearer: []}]
      responses:
        "200":
          description: OpenAI model list with a single entry, owned_by "local"
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/chat/completions:
    post:
      summary: Chat completion, plain JSON or streamed as server-sent events
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatRequest"}
      responses:
        "200":
          description: |
            stream=false: a chat.completion object with usage. stream=true: text/event-stream
            of chat.completion.chunk events, the last one carrying finish_reason and usage, then
            "data: [DONE]". Headers: X-RateLimit-Limit, X-RateLimit-Remaining, X-Queue-Wait-Ms,
            X-Prompt-Tokens, X-Max-Context.
        "400":
          description: invalid_request (validation failed) or model_not_found (another model asked for)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413":
          description: |
            body_too_large (over MAX_BODY_BYTES, default 262144) or context_length_exceeded:
            prompt tokens + max_tokens over MAX_CONTEXT (default 4096), or, without max_tokens,
            less than 64 tokens (min_output) left for the reply. Tokens are counted with the model's own tokenizer.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          description: rate_limit_exceeded, per key (RATE_LIMIT_RPM, default 20/min, or the key's own rpm); Retry-After set
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "499":
          description: client_closed, the client went away while queued
        "502":
          description: upstream_error, Ollama failed during generation
        "503":
          description: |
            server_busy: all MAX_CONCURRENT slots (default 2) busy and MAX_QUEUE (default 6) requests
            already waiting, or no slot freed within QUEUE_TIMEOUT (default 120 s); Retry-After 10
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "A key from API_KEYS (name:key[:rpm],...): Authorization: Bearer <key>"
  responses:
    Unauthorized:
      description: invalid_api_key, the header is missing or the key is unknown
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Message:
      type: object
      required: [role, content]
      properties:
        role: {type: string, enum: [system, user, assistant]}
        content: {type: string}
    ChatRequest:
      type: object
      required: [messages]
      properties:
        model: {type: string, description: "optional; must equal the served model (MODEL) if given"}
        messages: {type: array, minItems: 1, items: {$ref: "#/components/schemas/Message"}}
        stream: {type: boolean, default: false}
        max_tokens: {type: integer, minimum: 1, description: "capped at MAX_OUTPUT (default 1024)"}
        max_completion_tokens: {type: integer, minimum: 1, description: "takes precedence over max_tokens"}
        temperature: {type: number, minimum: 0, maximum: 2}
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message: {type: string}
            type: {type: string, enum: [invalid_request_error, server_error]}
            code: {type: string}
    Health:
      type: object
      properties:
        status: {type: string, enum: [ok, degraded]}
        ollama: {type: string, description: Ollama version}
        model: {type: string}
        model_pulled: {type: boolean}
        load: {type: object, properties: {active: {type: integer}, queued: {type: integer}}}
        limits: {type: object, description: "max_context, max_output, rate_limit_rpm, max_concurrent, max_queue, queue_timeout"}
        served: {type: object, description: responses by status code}
        tokens: {type: object, description: prompt and completion tokens processed}
        uptime: {type: integer, description: seconds}
