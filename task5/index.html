<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model tier comparison</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="masthead">
  <h1>Model tier comparison</h1>
  <p>One prompt, three tiers of model, measured three times each.</p>
</header>

<main>

<section class="panel">
  <div class="grid-2">
    <label class="field">
      <span class="label">Hugging Face token</span>
      <input id="token" type="password" placeholder="hf_…" autocomplete="off" spellcheck="false">
      <span class="hint" id="tokenHint">Kept in this browser only.</span>
    </label>
    <div class="field">
      <span class="label">Per run</span>
      <div class="grid-3">
        <label class="sub">
          <span class="hint">temperature</span>
          <input id="temperature" type="number" value="0.7" min="0" max="2" step="0.1">
        </label>
        <label class="sub">
          <span class="hint">max tokens</span>
          <input id="maxTokens" type="number" value="1024" min="16" max="8192" step="16">
        </label>
        <label class="sub">
          <span class="hint">runs</span>
          <select id="runs">
            <option value="1">1</option>
            <option value="3" selected>3</option>
            <option value="5">5</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <label class="field">
    <span class="label">Prompt</span>
    <textarea id="prompt" rows="5" spellcheck="false"
      placeholder="Ask the same thing of all three…"></textarea>
  </label>

  <div class="actions">
    <button id="run" class="primary">Run</button>
    <button id="stop" hidden>Stop</button>
    <span id="status" class="hint"></span>
    <span id="spend" class="hint spend"></span>
  </div>
</section>

<section class="columns">

  <div class="column" data-tier="low">
    <div class="column-head">
      <span class="tier">low</span>
      <span class="hint published"></span>
    </div>
    <div class="column-pick"><select class="model"></select></div>
    <div class="metrics"></div>
    <div class="tabs" hidden></div>
    <div class="views">
      <button type="button" class="view" data-mode="original">original</button>
      <button type="button" class="view" data-mode="formatted">formatted</button>
    </div>
    <div class="response"><div class="reasoning" hidden></div><span class="answer"></span></div>
  </div>

  <div class="column" data-tier="mid">
    <div class="column-head">
      <span class="tier">mid</span>
      <span class="hint published"></span>
    </div>
    <div class="column-pick"><select class="model"></select></div>
    <div class="metrics"></div>
    <div class="tabs" hidden></div>
    <div class="views">
      <button type="button" class="view" data-mode="original">original</button>
      <button type="button" class="view" data-mode="formatted">formatted</button>
    </div>
    <div class="response"><div class="reasoning" hidden></div><span class="answer"></span></div>
  </div>

  <div class="column" data-tier="high">
    <div class="column-head">
      <span class="tier">high</span>
      <span class="hint published"></span>
    </div>
    <div class="column-pick"><select class="model"></select></div>
    <div class="metrics"></div>
    <div class="tabs" hidden></div>
    <div class="views">
      <button type="button" class="view" data-mode="original">original</button>
      <button type="button" class="view" data-mode="formatted">formatted</button>
    </div>
    <div class="response"><div class="reasoning" hidden></div><span class="answer"></span></div>
  </div>

</section>

<p class="hint footnote" id="catalogue"></p>

</main>

<script src="markdown.js"></script>
<script src="api.js"></script>
<script src="models.js"></script>
<script src="app.js"></script>
</body>
</html>
