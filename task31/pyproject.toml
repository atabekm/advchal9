[project]
name = "devassist"
version = "0.1.0"
description = "A developer assistant for this repository: RAG over its docs, git state over MCP"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
devassist = "devassist.cli:main"
devmcp = "devmcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devassist", "devmcp"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore:builtin type .* has no __module__:DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
