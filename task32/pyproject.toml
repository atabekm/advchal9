[project]
name = "devreview"
version = "0.1.0"
description = "Automated code review of pull requests: diff + RAG over docs and code + a local model"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
devreview = "devreview.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devreview"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore:builtin type .* has no __module__:DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
