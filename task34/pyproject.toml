[project]
name = "fileassist"
version = "0.1.0"
description = "A project file assistant: an agent that reads, searches and edits a project through an MCP server"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "mcp>=2.3.0",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
fileassist = "fileassist.cli:main"
filemcp = "filemcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fileassist", "filemcp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type .* has no __module__:DeprecationWarning"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
