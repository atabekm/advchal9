[project]
name = "opt"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
bench = "opt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opt"]

[tool.pytest.ini_options]
pythonpath = ["."]
